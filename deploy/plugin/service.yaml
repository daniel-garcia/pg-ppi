apiVersion: v1
kind: Service
metadata:
  name: pgppi
  labels:
    app: pgppi
    cnpg.io/pluginName: pgppi.daniel-garcia.github.io
  annotations:
    cnpg.io/pluginClientSecret: pgppi-client-tls
    cnpg.io/pluginServerSecret: pgppi-server-tls
    cnpg.io/pluginPort: "9090"
spec:
  selector: {app: pgppi}
  ports:
  - {name: grpc, port: 9090, targetPort: 9090}
